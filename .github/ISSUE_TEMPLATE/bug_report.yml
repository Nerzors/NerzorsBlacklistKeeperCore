name: Bug report / Fehler melden
description: Something doesn't work as it should. / Etwas funktioniert nicht wie erwartet.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! English or German is fine. / Danke fürs Melden! Deutsch oder Englisch, beides ist okay.
        Quick questions are often faster on [Discord](https://discord.nerzors.de/).

  - type: input
    id: version
    attributes:
      label: NBK version / NBK-Version
      description: Shown at the bottom of the main window (`/nbk`). / Steht unten im Hauptfenster (`/nbk`).
      placeholder: "2.2.0-beta.1"
    validations:
      required: true

  - type: dropdown
    id: flavor
    attributes:
      label: Game version / Spielversion
      options:
        - Retail
        - Classic Era
        - Classic MoP
        - "WoW: Forever"
    validations:
      required: true

  - type: dropdown
    id: download
    attributes:
      label: Download
      options:
        - Full download / Komplett-Download
        - Core-only edition / Kern-Ausgabe
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: What did you do, what did you expect, what happened instead? / Was hast du gemacht, was hast du erwartet, was ist stattdessen passiert?
      placeholder: |
        1. /nbk
        2. Clicked "+ Add" …
        3. …
    validations:
      required: true

  - type: textarea
    id: lua-error
    attributes:
      label: Lua error (if any) / Lua-Fehler (falls vorhanden)
      description: With BugSack/BugGrabber or `/console scriptErrors 1`. / Mit BugSack/BugGrabber oder `/console scriptErrors 1`.
      render: text

  - type: input
    id: language
    attributes:
      label: Game language / Spielsprache
      placeholder: "deDE, enUS, frFR …"

  - type: textarea
    id: other-addons
    attributes:
      label: Other addons that might matter / Andere Addons, die eine Rolle spielen könnten
      description: e.g. chat, tooltip or unit frame addons. / z. B. Chat-, Tooltip- oder Rahmen-Addons.
