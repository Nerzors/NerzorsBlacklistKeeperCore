name: Idea / Idee
description: Suggest a feature or an improvement. / Schlag eine Funktion oder Verbesserung vor.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! English or German is fine. / Danke für die Idee! Deutsch oder Englisch, beides ist okay.
        Please check the [open ideas](https://github.com/Nerzors/NerzorsBlacklistKeeperCore/issues?q=is%3Aissue+label%3Aenhancement) first – a 👍 on an existing one helps too.

  - type: textarea
    id: problem
    attributes:
      label: What would you like to do? / Was möchtest du tun können?
      description: Describe the situation in game, not the solution yet. / Beschreib die Situation im Spiel, noch nicht die Lösung.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea / Deine Idee
      description: How could NBK help with that? / Wie könnte NBK dabei helfen?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area / Bereich
      options:
        - Blacklist / main window
        - Group warning / tooltip
        - Chat filter / message history
        - Ignore list / Ignore Manager
        - Group finder
        - Remember Me / Mythic+
        - Recent groups
        - Sharing / Auto-Sync
        - Statistics
        - Settings / themes
        - Something else / Etwas anderes
